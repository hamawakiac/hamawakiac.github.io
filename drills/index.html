<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ドリル管理 | 浜脇AC</title>
  <style>
    :root { color-scheme: light; font-family: "Atkinson Hyperlegible Next", system-ui, sans-serif; color: #152d2a; background: #f3f6f2; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    header { background: #123b33; color: white; padding: 2rem max(1rem, calc((100% - 60rem) / 2)); }
    header a { color: #c7f0d7; }
    h1 { margin: .55rem 0 0; font-size: clamp(1.9rem, 5vw, 3rem); }
    main { max-width: 62rem; margin: auto; padding: 1rem; }
    h2 { margin-top: 1.6rem; }
    .section-title h2, h3, ol { margin: 0; }
    .toolbar, .section-title, .actions { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
    .toolbar { position: sticky; top: 0; z-index: 1; background: #f3f6f2; padding: .65rem 0; }
    .toolbar p { margin: 0; font-size: .9rem; }
    .section-title { justify-content: space-between; }
    section { background: #fff; border: 1px solid #d3e0d9; border-radius: .75rem; padding: 1rem; margin-bottom: .75rem; }
    ol { padding: 0; list-style: none; }
    li { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; align-items: center; gap: .65rem; padding: .65rem 0; border-top: 1px solid #d3e0d9; }
    li:first-child { margin-top: .75rem; }
    section.drop-target { outline: 3px solid #08724d; outline-offset: -3px; }
    li.drop-target { box-shadow: inset 0 3px #08724d; }
    .item-name, .notes { overflow-wrap: anywhere; }
    .notes { margin: .2rem 0 0; white-space: pre-wrap; color: #39534d; }
    .empty { margin: .6rem 0 0; color: #39534d; }
    .handle { cursor: grab; min-width: 2rem; text-align: center; padding: .65rem .25rem; color: #39534d; touch-action: none; user-select: none; -webkit-touch-callout: none; }
    li.moving { background: #e4f4e9; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; color: #173c33; background: white; border: 1px solid #a5bbb0; border-radius: .4rem; padding: .42rem .7rem; min-height: 2.5rem; }
    button:disabled { cursor: default; opacity: .55; }
    button.primary { color: #fff; background: #086146; border-color: #086146; }
    button.danger { color: #91291e; }
    :focus-visible { outline: 3px solid #036bc4; outline-offset: 2px; }
    dialog { width: min(31rem, calc(100% - 2rem)); border: 1px solid #a5bbb0; border-radius: .75rem; padding: 1.25rem; }
    dialog::backdrop { background: #122b27a0; }
    dialog h2 { margin: 0 0 1rem; }
    label { display: block; margin-bottom: .9rem; }
    input, textarea { display: block; width: 100%; padding: .5rem; border: 1px solid #8aada0; border-radius: .35rem; }
    textarea { resize: vertical; }
    @media (max-width: 38rem) {
      li { grid-template-columns: auto minmax(0, 1fr); }
      li .actions { grid-column: 2; }
    }
  </style>
</head>
<body>
  <header>
    <a href="../">浜脇AC</a>
    <h1>ドリル管理</h1>
  </header>
  <main>
    <div class="toolbar">
      <button id="new-drill" type="button">＋ ドリル種目を新規作成</button>
      <button id="new-group" type="button">＋ 分類を追加</button>
      <button id="save" class="primary" type="button">保存</button>
      <p id="status" role="status">変更はこのブラウザーに保存されます。</p>
    </div>
    <p>項目の左端をドラッグして、移動先の欄に置いてください。スマートフォンでは左端を長押しして移動できます。同じ欄での並べ替えには上下の矢印も使えます。</p>
    <noscript>ドリル管理を使うには JavaScript を有効にしてください。</noscript>
    <div id="groups"></div>
  </main>
  <dialog id="editor" aria-labelledby="editor-title">
    <form id="edit-form">
      <h2 id="editor-title"></h2>
      <label>ドリル種目名<input id="item-name" required maxlength="120" autofocus></label>
      <label>ドリルの説明<textarea id="item-notes" rows="5" maxlength="2000" placeholder="やり方、距離・回数、意識するポイントなど"></textarea></label>
      <label>種類・区分<textarea id="item-category" rows="1"></textarea></label>
      <label>セット・本数<textarea id="item-sets" rows="1"></textarea></label>
      <label>強度<textarea id="item-intensity" rows="1"></textarea></label>
      <label>レスト<textarea id="item-rest" rows="1"></textarea></label>
      <label>所要時間<textarea id="item-duration" rows="1"></textarea></label>
      <label>対象<textarea id="item-target" rows="1"></textarea></label>
      <label>注意点<textarea id="item-caution" rows="1"></textarea></label>
      <div class="actions">
        <button class="primary" type="submit">反映</button>
        <button id="cancel-edit" type="button">キャンセル</button>
      </div>
    </form>
  </dialog>
  <dialog id="group-editor" aria-labelledby="group-editor-title">
    <form id="group-form">
      <h2 id="group-editor-title">ドリルの分類を追加</h2>
      <label>分類名<input id="group-name" required maxlength="60" autofocus></label>
      <div class="actions">
        <button class="primary" type="submit">追加</button>
        <button id="cancel-group" type="button">キャンセル</button>
      </div>
    </form>
  </dialog>
  <dialog id="remove-dialog" aria-labelledby="remove-title">
    <form method="dialog">
      <h2 id="remove-title">項目を削除</h2>
      <p id="remove-description"></p>
      <div class="actions">
        <button value="cancel" autofocus>キャンセル</button>
        <button class="danger" value="delete">削除する</button>
      </div>
    </form>
  </dialog>
  <script>
    "use strict";

    const groups = [
      { id: "basic", title: "基本ドリル" },
      { id: "sprint", title: "スプリントドリル" },
      { id: "start", title: "スタートドリル" },
      { id: "unclassified", title: "未分類のドリル" }
    ];
    const initialItems = {
      basic: [
        ["直立でその場で跳ねてから同じリズムで走る"],
        ["高速腿上げ"],
        ["メディシンボール走"],
        ["腕無し走"],
        ["丸太ドリル"]
      ],
      "20m": [
        ["肩関節回し"],
        ["ヒップロック1"],
        ["右肩関節"],
        ["左肩関節"],
        ["ランジ肩関節"],
        ["ヒップロック2"],
        ["上体バランス体重移動"],
        ["体重移動走"],
        ["ランジ腕回し"],
        ["接地"],
        ["腕回し"],
        ["ランジ脇腹伸ばし"]
      ],
      movement: [
        ["腕回しスキップ40m"],
        ["バックスキップ40m"],
        ["腕回しサイドスキップ40m"],
        ["クロススキップ40m"],
        ["股関節回し前20m歩→20mスキップ"],
        ["股関節回し後20m歩→20mスキップ"],
        ["空中切り替え10mウォークバック×2"],
        ["Aスキップ10mウォークバック×2"],
        ["Bスキップ20mウォークバック×2"],
        ["Cスキップ20mウォークバック×2"],
        ["流し60m×1"]
      ]
    };
    // Source: hamawakiac/menu, STARTER_MENUS at b704ae38.
    const importedDrills = [
      {"group":"unclassified","masterId":"overall-running-drills","name":"共通ランニングドリル","notes":"Aスキップ、Bスキップ、腿上げ、バウンディング、快調走60m×2。","category":"全体メニュー（前半）","sets":"各20m×2","intensity":"中","rest":"歩いて戻る","duration":"15分","target":"全員","caution":"速さより姿勢と接地を優先"},
      {"group":"unclassified","masterId":"hurdle-approach-3","name":"1台目アプローチ練習","notes":"スタートから1台目までを反復し、歩数と踏切位置を安定させる。","category":"ハードルメニュー","sets":"5〜7本","intensity":"90〜95％","rest":"4分","duration":"35分","target":"100mH・110mH","caution":"ハードル高は発達段階に合わせる"},
      {"group":"unclassified","masterId":"hurdle-5","name":"5台リズム走","notes":"5台を一定リズムで走り、抜き足後の接地をそろえる。","category":"ハードルメニュー","sets":"4〜6本","intensity":"85〜95％","rest":"5〜6分","duration":"45分","target":"ハードル","caution":"台間を無理に合わせず個別調整"},
      {"group":"unclassified","masterId":"xlsx-hurdle-mobility","name":"ハードルドリル（股関節可動域）","notes":"またぎ越し、サイドステップ等ハードルを使った可動域改善ドリル。","category":"ハードルメニュー","sets":"各8〜10回×2セット","intensity":"低〜中","rest":"種目間30秒","duration":"15分","target":"ハードルパート","caution":"股関節の柔軟性・可動域向上が目的。無理に高いハードルを使用しない。"},
      {"group":"unclassified","masterId":"xlsx-hurdle-3-5","name":"3歩・5歩間ハードル","notes":"インターバルを短めに設定し、3歩または5歩のリズムで走り抜ける。","category":"ハードルメニュー","sets":"5〜6本","intensity":"中〜高（80〜90％）","rest":"90秒〜2分","duration":"25分","target":"ハードルパート","caution":"リズム習得を最優先し、ハードル間隔は身長・技術レベルに応じて調整する。"},
      {"group":"unclassified","masterId":"xlsx-hurdle-interval","name":"インターバルハードル","notes":"正規または短縮したインターバルで3〜5台のハードルを走り越える。","category":"ハードルメニュー","sets":"4〜5本","intensity":"高（85〜95％）","rest":"3分","duration":"30分","target":"ハードルパート（経験者中心）","caution":"抜き脚・リード脚のフォームを重視。疲労によるフォーム崩れに注意する。"},
      {"group":"unclassified","masterId":"jump-short","name":"短助走跳躍","notes":"6〜10歩助走から踏切姿勢と空中動作を確認。走幅跳・走高跳で内容を分ける。","category":"跳躍メニュー","sets":"6〜8本","intensity":"85〜90％","rest":"3〜4分","duration":"40分","target":"跳躍","caution":"着地場所とマット周辺を常時確認"},
      {"group":"unclassified","masterId":"xlsx-jump-approach","name":"助走マーク合わせ","notes":"走り幅跳び・走り高跳びの助走リズムを確認し、マークを調整する。","category":"跳躍メニュー","sets":"6〜8本","intensity":"中（70〜85％）","rest":"90秒","duration":"20分","target":"跳躍パート","caution":"助走の再現性向上が目的。風向き・風速も考慮して調整する。"},
      {"group":"unclassified","masterId":"xlsx-jump-takeoff","name":"踏切練習","notes":"短助走からの踏切動作反復（片脚踏切、連続バウンディング等）。","category":"跳躍メニュー","sets":"各8〜10回×2〜3セット","intensity":"中〜高","rest":"60秒","duration":"20分","target":"跳躍パート","caution":"着地時の膝への負担に注意。シューズと砂場の状態を事前に確認する。"},
      {"group":"unclassified","masterId":"xlsx-jump-special","name":"専門ドリル（走り幅跳び／走り高跳び）","notes":"はさみ跳び・そり跳び（走高）、空中動作・着地（走幅）等の種目別技術ドリル。","category":"跳躍メニュー","sets":"各6〜8回×2セット","intensity":"中","rest":"60〜90秒","duration":"25分","target":"跳躍パート（種目別）","caution":"個人の技術課題に応じて内容を変える。マット・砂場の安全確認を徹底する。"},
      {"group":"unclassified","masterId":"throw-standing","name":"立ち投げ技術","notes":"助走を使わず、下半身から上半身への力の伝達を確認。","category":"投擲メニュー","sets":"8〜12投","intensity":"75〜85％","rest":"2分","duration":"35分","target":"投擲","caution":"器具別に安全エリアを分ける"},
      {"group":"unclassified","masterId":"throw-partial","name":"分習投げ","notes":"砲丸・円盤・やりの動作を局面別に分け、課題部分を反復する。","category":"投擲メニュー","sets":"各局面6〜8回","intensity":"中","rest":"適宜","duration":"40分","target":"投擲","caution":"同時投擲を避ける"},
      {"group":"unclassified","masterId":"xlsx-throw-basic","name":"基本フォームドリル","notes":"砲丸・ジャベリックボール等を使ったグリップ・体幹連動の基礎動作反復。","category":"投擲メニュー","sets":"各10〜15回×2セット","intensity":"低〜中","rest":"種目間30秒","duration":"15分","target":"投てきパート","caution":"用具の扱い方の安全指導を徹底。投てきエリアの周囲確認を必ず行う。"},
      {"group":"unclassified","masterId":"xlsx-throw-approach","name":"助走・体重移動練習","notes":"クロスステップ・ホップ等の助走から体重移動を伴う投てき動作を反復する。","category":"投擲メニュー","sets":"6〜8本","intensity":"中（70〜85％）","rest":"90秒","duration":"25分","target":"投てきパート","caution":"下半身から上半身への力の伝達を意識させる。投てき方向の安全確認を必須とする。"},
      {"group":"sprint","masterId":"overall-speed-coordination","name":"全体スピード調整走","notes":"60m流しを70％、80％、90％で1本ずつ。種目別練習へ移る前の動き確認。","category":"全体メニュー（前半）","sets":"60m×3","intensity":"70〜90％","rest":"2分","duration":"12分","target":"全員","caution":"競走にしない"},
      {"group":"sprint","masterId":"sprint-fly-30","name":"フライング30m","notes":"30m助走＋30m計測区間。最高速度時の接地とリラックスを狙う。","category":"短距離メニュー","sets":"4〜5本","intensity":"95〜100％","rest":"5〜6分","duration":"35分","target":"短距離","caution":"疲労でフォームが崩れたら終了"},
      {"group":"sprint","masterId":"xlsx-sprint-accel","name":"加速走","notes":"30〜60mを徐々にスピードを上げながら加速していく走。","category":"短距離メニュー","sets":"4〜6本","intensity":"中〜高（80〜95％）","rest":"2〜3分","duration":"25分","target":"短距離パート","caution":"上体の起こし方とピッチ・ストライドのバランスを確認する。"},
      {"group":"sprint","masterId":"xlsx-sprint-marks","name":"マーク走","notes":"マーカーを一定間隔で設置し、ストライドを合わせて走る（30〜50m）。","category":"短距離メニュー","sets":"4〜6本","intensity":"中（75〜85％）","rest":"2分","duration":"20分","target":"短距離パート","caution":"ピッチ向上と接地位置の修正が目的。マーク間隔は個人の歩幅に合わせて設定する。"},
      {"group":"sprint","masterId":"xlsx-sprint-max-speed","name":"中間疾走（トップスピード）走","notes":"30〜40mの入りから60〜80mでトップスピードを維持して走る。","category":"短距離メニュー","sets":"3〜5本","intensity":"高（90〜100％）","rest":"4〜5分","duration":"30分","target":"短距離パート（中2・中3中心）","caution":"完全に回復してから次本を行う。疲労が見える場合は本数を減らす。"},
      {"group":"sprint","masterId":"xlsx-sprint-wind","name":"流し（ウインドスプリント）","notes":"60〜80％程度の強度で力まずに走るスプリント。","category":"短距離メニュー","sets":"4〜6本","intensity":"低〜中（60〜80％）","rest":"60〜90秒","duration":"15分","target":"短距離パート","caution":"フォーム確認・調整が目的。全力で走らず、力を抜くことを意識させる。"},
      {"group":"start","masterId":"xlsx-sprint-start","name":"スタートダッシュ","notes":"クラウチングスタートから10〜30mの一次加速を反復。","category":"短距離メニュー","sets":"6〜8本×2セット","intensity":"高（90〜100％）","rest":"本数間90秒、セット間3分","duration":"30分","target":"短距離パート（レベル別グループ）","caution":"反応と一次加速の姿勢を意識。フライング厳禁を徹底し、本数の詰め込みすぎに注意。"}
    ];
    // Keep the previous defaults for comparison with saved entries.
    const retiredDrills = [
      {"masterId":"hurdle-mobility","name":"ハードルモビリティ","notes":"またぎ、抜き足、リード脚、横向きドリルを低いハードルで行う。","category":"ハードルメニュー","sets":"各6台×2","intensity":"低〜中","rest":"歩いて戻る","duration":"25分","target":"ハードル","caution":"骨盤が流れないようにする"},
      {"masterId":"jump-approach","name":"助走リズム確認","notes":"チェックマークを用いて助走の前半・後半リズムを確認する。","category":"跳躍メニュー","sets":"6〜10本","intensity":"75〜90％","rest":"2〜3分","duration":"35分","target":"跳躍","caution":"全助走だけに偏らない"},
      {"masterId":"sprint-accel-30","name":"加速走30m","notes":"3点またはクラウチングスタートから30m。最初の10歩の押し出しと姿勢変化を確認。","category":"短距離メニュー","sets":"4〜6本","intensity":"95％","rest":"3〜4分","duration":"30分","target":"短距離","caution":"本数より質を優先"}
    ];
    const detailFields = {"category":"種類・区分","sets":"セット・本数","intensity":"強度","rest":"レスト","duration":"所要時間","target":"対象","caution":"注意点"};
    const detailInputs = Object.keys(detailFields).map(key => [key, document.getElementById("item-" + key)]);
    const customGroupsKey = "_customDrillGroups";
    const migrationKey = "_practiceDrillsImported";
    let storedSnapshot = null;
    let storageReadable = true;
    let savedData = {};
    const storageKey = "hamawakiac.drills.v1";
    const container = document.getElementById("groups");
    const status = document.getElementById("status");
    const save = document.getElementById("save");
    const editor = document.getElementById("editor");
    const nameField = document.getElementById("item-name");
    const notesField = document.getElementById("item-notes");
    const removeDialog = document.getElementById("remove-dialog");
    const sections = new Map();
    let changed = false;
    let editTarget;
    let removeTarget;
    let dragSource;

    function element(tag, text, className) {
      const node = document.createElement(tag);
      if (text) node.textContent = text;
      if (className) node.className = className;
      return node;
    }

    function button(label, action, accessibleLabel) {
      const node = element("button", label);
      node.type = "button";
      if (accessibleLabel) node.setAttribute("aria-label", accessibleLabel);
      node.addEventListener("click", action);
      return node;
    }

    function loadItems() {
      let saved;
      try {
        storedSnapshot = localStorage.getItem(storageKey);
        saved = JSON.parse(storedSnapshot);
        if (storedSnapshot !== null && (!saved || typeof saved !== "object" || Array.isArray(saved))) {
          throw new Error("Invalid drill data");
        }
        savedData = saved ?? {};
      } catch {
        storageReadable = false;
        status.textContent = "保存済みデータを読み込めませんでした。既存データを保護するため保存できません。";
      }
      if (Array.isArray(savedData[customGroupsKey])) {
        for (const group of savedData[customGroupsKey]) {
          if (typeof group?.id !== "string" || !/^custom-[1-9][0-9]*$/.test(group.id) ||
              typeof group.title !== "string" || !group.title.trim() || groups.some(({ id }) => id === group.id)) continue;
          groups.push({ id: group.id, title: group.title });
        }
      }

      function readList(id) {
        const list = saved?.[id];
        const valid = Array.isArray(list) && list.every(item =>
          typeof item?.name === "string" && typeof item.notes === "string"
        );
        if (Object.hasOwn(savedData, id) && !valid) {
          storageReadable = false;
          status.textContent = "保存済みデータの形式を確認できませんでした。既存データを保護するため保存できません。";
        }
        return valid ? list : (initialItems[id] ?? []).map(([name, notes = ""]) => ({ name, notes }));
      }

      const result = Object.fromEntries(groups.map(({ id }) => [id, readList(id)]));
      if (!Array.isArray(saved?.unclassified)) {
        result.unclassified = [
          ...readList("basic"),
          ...readList("20m").map(item => ({ ...item, notes: [item.notes, "動作を大きく"].filter(Boolean).join("\n") })),
          ...readList("movement"),
          ...readList("start")
        ];
        result.basic = [];
        result.sprint = readList("sprint");
        result.start = [];
      }
      for (const { id } of groups) {
        result[id] = result[id].filter(item => !retiredDrills.some(drill =>
          item.masterId === drill.masterId && drillContent(item) === drillContent(drill)
        ));
      }

      if (savedData[migrationKey] !== true) {
        const existing = Object.values(result).flat();
        for (const { group, ...drill } of importedDrills) {
          if (existing.some(item => item.masterId === drill.masterId || drillContent(item) === drillContent(drill))) continue;
          result[group].push(drill);
          existing.push(drill);
        }
      }
      return result;
    }

    function drillContent(item) {
      return JSON.stringify(["name", "notes", ...Object.keys(detailFields)].map(key =>
        normalizedText(item[key])
      ));
    }

    function normalizedText(value) {
      return String(value ?? "").normalize("NFKC").replace(/\s+/g, " ").trim().toLowerCase();
    }

    const items = loadItems();

    function markChanged() {
      changed = true;
      status.textContent = "未保存の変更があります。";
    }

    function openEditor(group, index) {
      editTarget = { group, index };
      const item = items[group.id][index];
      document.getElementById("editor-title").textContent = group.title + (item ? "の項目を編集" : "に項目を追加");
      nameField.value = item?.name ?? "";
      notesField.value = item?.notes ?? "";
      for (const [key, input] of detailInputs) input.value = item?.[key] ?? "";
      nameField.setCustomValidity("");
      editor.showModal();
    }

    function move(group, from, to, focusAction, destination = group) {
      const targetItems = items[destination.id];
      if (group === destination && (from === to || (from === targetItems.length - 1 && to === targetItems.length))) return;
      const [item] = items[group.id].splice(from, 1);
      targetItems.splice(to, 0, item);
      markChanged();
      if (group !== destination) renderList(group);
      const rows = renderList(destination);
      if (focusAction) {
        const row = rows.children[to];
        const control = row.querySelector('[data-action="' + focusAction + '"]');
        (control.disabled ? row.querySelector('[data-action="edit"]') : control).focus();
      }
    }

    let highlightedDrop;

    function findDropTarget(node) {
      const section = node?.closest("section[data-group]");
      if (!section) return null;
      const { group, list } = sections.get(section.dataset.group);
      const row = node.closest("li");
      return {
        group,
        index: row?.parentElement === list ? Array.from(list.children).indexOf(row) : items[group.id].length,
        element: row?.parentElement === list ? row : section
      };
    }

    function highlightDrop(target) {
      highlightedDrop?.classList.remove("drop-target");
      highlightedDrop = target?.element;
      highlightedDrop?.classList.add("drop-target");
    }

    function enableTouchMove(handle, row, group, index) {
      let gesture;

      function highlight(x, y) {
        gesture.target = findDropTarget(document.elementFromPoint(x, y));
        highlightDrop(gesture.target?.element === row ? null : gesture.target);
      }

      function scrollNearEdge() {
        const { x, y } = gesture;
        const edge = 76;
        const top = document.querySelector(".toolbar").getBoundingClientRect().bottom;
        const step = y < Math.max(edge, top + 24) ? -10 : y > window.innerHeight - edge ? 10 : 0;
        if (step) {
          window.scrollBy(0, step);
          highlight(x, y);
        }
        gesture.frame = requestAnimationFrame(scrollNearEdge);
      }

      function finish(event) {
        if (gesture?.id !== event.pointerId) return;
        clearTimeout(gesture.timer);
        cancelAnimationFrame(gesture.frame);
        row.classList.remove("moving");
        highlightDrop(null);
        const target = gesture.active && event.type === "pointerup" ? gesture.target : null;
        gesture = undefined;
        handle.draggable = true;
        if (target) move(group, index, target.index, undefined, target.group);
      }

      handle.addEventListener("pointerdown", event => {
        if (event.pointerType !== "touch" || !event.isPrimary) return;
        const { pointerId: id, clientX: x, clientY: y } = event;
        handle.draggable = false;
        handle.setPointerCapture(id);
        gesture = { id, x, y, active: false };
        gesture.timer = setTimeout(() => {
          gesture.active = true;
          row.classList.add("moving");
          highlight(gesture.x, gesture.y);
          gesture.frame = requestAnimationFrame(scrollNearEdge);
        }, 350);
      });
      handle.addEventListener("pointermove", event => {
        if (gesture?.id !== event.pointerId) return;
        const { clientX: x, clientY: y } = event;
        if (!gesture.active) {
          if (Math.hypot(x - gesture.x, y - gesture.y) > 10) finish(event);
          return;
        }
        gesture.x = x;
        gesture.y = y;
        highlight(x, y);
      });
      for (const type of ["pointerup", "pointercancel", "lostpointercapture"]) {
        handle.addEventListener(type, finish);
      }
      handle.addEventListener("contextmenu", event => event.preventDefault());
    }

    function renderList(group) {
      const { list, empty } = sections.get(group.id);
      const entries = items[group.id];
      empty.hidden = entries.length > 0;
      list.replaceChildren(...entries.map((item, index) => {
        const { name, notes } = item;
        const row = element("li");
        const handle = element("span", "⠿", "handle");
        handle.setAttribute("aria-hidden", "true");
        handle.draggable = true;
        enableTouchMove(handle, row, group, index);
        handle.addEventListener("dragstart", event => {
          if (row.classList.contains("moving")) {
            event.preventDefault();
            return;
          }
          dragSource = { group, index };
          event.dataTransfer.effectAllowed = "move";
          event.dataTransfer.setData("text/plain", name);
        });
        handle.addEventListener("dragend", () => {
          dragSource = undefined;
          highlightDrop(null);
        });

        const description = element("div");
        description.append(element("strong", name, "item-name"));
        if (notes) description.append(element("p", notes, "notes"));
        for (const [key, label] of Object.entries(detailFields)) {
          if (item[key]) description.append(element("p", label + "　" + item[key], "notes"));
        }
        const actions = element("div", "", "actions");
        const up = button("↑", () => move(group, index, index - 1, "up"), name + "を上へ");
        const down = button("↓", () => move(group, index, index + 1, "down"), name + "を下へ");
        up.dataset.action = "up";
        down.dataset.action = "down";
        up.disabled = index === 0;
        down.disabled = index === entries.length - 1;
        const edit = button("編集", () => openEditor(group, index), name + "を編集");
        edit.dataset.action = "edit";
        const remove = button("削除", () => {
          removeTarget = { group, index };
          removeDialog.returnValue = "cancel";
          document.getElementById("remove-description").textContent = "「" + name + "」を削除しますか？";
          removeDialog.showModal();
        }, name + "を削除");
        actions.append(up, down, edit, remove);
        row.append(handle, description, actions);
        return row;
      }));
      return list;
    }

    function renderGroup(group) {
      const section = element("section");
      section.dataset.group = group.id;
      const title = element("h2", group.title);
      title.id = "heading-" + group.id;
      section.setAttribute("aria-labelledby", title.id);
      const heading = element("div", "", "section-title");
      const add = button("＋ 種目を追加", () => openEditor(group), group.title + "に追加");
      heading.append(title, add);
      const list = element("ol");
      const empty = element("p", "登録された項目はありません。", "empty");
      section.append(heading);
      section.append(list, empty);
      sections.set(group.id, { group, list, empty, add });
      container.append(section);
      renderList(group);
    }

    groups.forEach(renderGroup);

    const groupEditor = document.getElementById("group-editor");
    const groupName = document.getElementById("group-name");
    document.getElementById("new-group").addEventListener("click", () => {
      groupName.value = "";
      groupName.setCustomValidity("");
      groupEditor.showModal();
    });
    document.getElementById("cancel-group").addEventListener("click", () => groupEditor.close());
    groupName.addEventListener("input", () => groupName.setCustomValidity(""));
    document.getElementById("group-form").addEventListener("submit", event => {
      event.preventDefault();
      const title = groupName.value.trim();
      if (!title || groups.some(group => normalizedText(group.title) === normalizedText(title))) {
        groupName.setCustomValidity(title ? "この分類名はすでに使われています。" : "分類名を入力してください。");
        groupName.reportValidity();
        return;
      }
      let number = 1;
      while (Object.hasOwn(savedData, "custom-" + number) || Object.hasOwn(items, "custom-" + number)) number++;
      const group = { id: "custom-" + number, title };
      groups.push(group);
      items[group.id] = [];
      renderGroup(group);
      groupEditor.close();
      markChanged();
      sections.get(group.id).add.focus();
    });

    container.addEventListener("dragover", event => {
      if (!dragSource) return;
      const target = findDropTarget(event.target);
      highlightDrop(target);
      if (!target) return;
      event.preventDefault();
      event.dataTransfer.dropEffect = "move";
    });
    container.addEventListener("dragleave", event => {
      if (!container.contains(event.relatedTarget)) highlightDrop(null);
    });
    container.addEventListener("drop", event => {
      const target = findDropTarget(event.target);
      if (!dragSource || !target) return;
      event.preventDefault();
      const { group, index } = dragSource;
      dragSource = undefined;
      highlightDrop(null);
      move(group, index, target.index, undefined, target.group);
    });

    document.getElementById("new-drill").addEventListener("click", () => openEditor(groups.find(group => group.id === "unclassified")));

    nameField.addEventListener("input", () => nameField.setCustomValidity(""));
    document.getElementById("cancel-edit").addEventListener("click", () => editor.close());
    document.getElementById("edit-form").addEventListener("submit", event => {
      event.preventDefault();
      const name = nameField.value.trim();
      if (!name) {
        nameField.setCustomValidity("ドリル種目名を入力してください。");
        nameField.reportValidity();
        return;
      }
      const { group, index } = editTarget;
      const target = index ?? items[group.id].length;
      const details = Object.fromEntries(detailInputs.map(([key, input]) => [key, input.value]));
      items[group.id][target] = { ...items[group.id][target], ...details, name, notes: notesField.value };
      editor.close();
      markChanged();
      renderList(group).children[target].querySelector('[data-action="edit"]').focus();
    });

    removeDialog.addEventListener("close", () => {
      if (removeDialog.returnValue !== "delete") return;
      const { group, index } = removeTarget;
      items[group.id].splice(index, 1);
      markChanged();
      renderList(group);
      sections.get(group.id).add.focus();
    });

    save.addEventListener("click", () => {
      try {
        if (!storageReadable) {
          status.textContent = "既存データを保護するため保存できません。";
          return;
        }
        if (localStorage.getItem(storageKey) !== storedSnapshot) {
          status.textContent = "別のタブで保存済みデータが更新されました。変更内容を控えてからページを再読み込みしてください。";
          return;
        }
        const customGroups = groups.filter(group => group.id.startsWith("custom-"));
        const nextSnapshot = JSON.stringify({
          ...savedData, ...items, [migrationKey]: true, [customGroupsKey]: customGroups
        });
        localStorage.setItem(storageKey, nextSnapshot);
        storedSnapshot = nextSnapshot;
        changed = false;
        status.textContent = "このブラウザーに保存しました。";
      } catch {
        status.textContent = "保存できませんでした。ブラウザーの保存設定を確認してください。";
      }
    });

    window.addEventListener("beforeunload", event => {
      if (!changed) return;
      event.preventDefault();
      event.returnValue = "";
    });
  </script>
</body>
</html>
